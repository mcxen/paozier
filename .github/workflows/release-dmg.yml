name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Release DMG
    runs-on: macos-14

    env:
      APP_NAME: Paozier
      BUNDLE_ID: com.openspring.paozier

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION#v}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and Package App Bundle
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_app.sh "${{ steps.version.outputs.version }}" "${{ github.run_number }}"

      - name: Verify Packaged Resources
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="dist/${APP_NAME}.app"
          test -x "${APP_PATH}/Contents/MacOS/${APP_NAME}"

          if ! find "${APP_PATH}/Contents/Resources" -name marked.umd.js -print -quit | grep -q .; then
            echo "ERROR: marked.umd.js was not packaged into ${APP_PATH}"
            exit 1
          fi

          codesign --verify --deep --strict "${APP_PATH}"

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail

          DMG_NAME="${APP_NAME}-${{ steps.version.outputs.version }}.dmg"
          DMG_ROOT="dist/dmg-root"

          mkdir -p "${DMG_ROOT}"
          cp -R "dist/${APP_NAME}.app" "${DMG_ROOT}/"
          ln -s /Applications "${DMG_ROOT}/Applications"

          hdiutil create \
            -volname "${APP_NAME}" \
            -srcfolder "${DMG_ROOT}" \
            -ov \
            -format UDZO \
            "dist/${DMG_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Paozier ${{ steps.version.outputs.version }}
          files: dist/Paozier-${{ steps.version.outputs.version }}.dmg
          generate_release_notes: true
